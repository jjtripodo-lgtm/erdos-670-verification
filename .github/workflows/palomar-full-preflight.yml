name: Official Palomar full preflight

# Manual only: confirm free storage headroom and paid-usage controls before dispatch.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public 40-character commit containing the reviewed palomar project
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-preflight:
    if: github.event.repository.private == false && github.repository == 'jjtripodo-lgtm/erdos-670-verification'
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: jjtripodo-lgtm/erdos-670-verification
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: fixed670test
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"palomar","comparator_config_path":"palomar/comparator.json","formalization_metadata_path":"palomar/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
