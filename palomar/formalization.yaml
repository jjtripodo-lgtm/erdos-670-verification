version: v0.4
project:
  name: "Fixed-dimensional separated Euclidean distances below 0.74 n squared"
  description: >-
    For every natural n at least 68000, the formalization constructs n injectively
    indexed points in the fixed Euclidean space R^458999. Distances between
    distinct points are at least one, distances attached to different unordered
    non-diagonal pairs differ by at least one, and both every pair distance and
    the diameter are strictly below (37/50)n^2. The dimension and threshold are
    explicit sufficient bounds; no optimality or independent priority review is
    claimed. This code-only port preserves the theorem of the cited public
    formalization. The full migrated build and final axiom audit have passed; the
    hosted sandboxed Comparator check has also passed.
  authors:
    - "John Tripodo"
  responsible_maintainers:
    - "John Tripodo"
  license: MIT
classification:
  arxiv: [math.CO, math.MG]
  msc2020: []
